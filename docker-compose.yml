services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  bot:
    build: .
    restart: unless-stopped
    depends_on:
      - mongo
      - redis
    env_file:
      - .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/komunitas-bot
      REDIS_URL: redis://redis:6379
    volumes:
      - ./storage:/app/storage

volumes:
  mongo-data:
  redis-data:
